name: Build Docker Image

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Login bei GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image bauen
        run: |
          docker build -t ghcr.io/valon-bb/html-openshift-app:v1 .

      - name: Docker Image pushen
        run: |
          docker push ghcr.io/valon-bb/html-openshift-app:v1
